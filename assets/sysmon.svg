<svg width="1000" height="290" viewBox="0 0 1000 290" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <clipPath id="card">
      <rect x="1" y="1" width="998" height="288" rx="18"/>
    </clipPath>
    <linearGradient id="barGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1f6feb"/>
      <stop offset="100%" stop-color="#2dd4bf"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M 44 0 H 0 V 44" stroke="#8b949e" stroke-opacity="0.05" stroke-width="1" fill="none"/>
    </pattern>
    <filter id="dotGlow" x="-300%" y="-300%" width="700%" height="700%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="orbBlur" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="50"/>
    </filter>
    <clipPath id="c1"><rect x="28" y="80" width="407" height="8" rx="4"/></clipPath>
    <clipPath id="c2"><rect x="28" y="116" width="398" height="8" rx="4"/></clipPath>
    <clipPath id="c3"><rect x="28" y="152" width="389" height="8" rx="4"/></clipPath>
    <clipPath id="c4"><rect x="28" y="188" width="345" height="8" rx="4"/></clipPath>
    <clipPath id="c5"><rect x="28" y="224" width="327" height="8" rx="4"/></clipPath>
    <clipPath id="c6"><rect x="28" y="260" width="354" height="8" rx="4"/></clipPath>
  </defs>

  <rect x="1" y="1" width="998" height="288" rx="18" fill="#0d1117"/>

  <g clip-path="url(#card)">
    <rect width="1000" height="290" fill="url(#grid)"/>
    <circle cx="920" cy="290" r="110" fill="#1f6feb" opacity="0.08" filter="url(#orbBlur)"/>

    <!-- title row -->
    <circle cx="30" cy="31" r="4" fill="#3fb950">
      <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="44" y="36" font-family="'SF Mono','Cascadia Code',Consolas,'Courier New',monospace" font-size="14" letter-spacing="2" fill="#7d8590">SYSTEM MONITOR</text>
    <text x="972" y="36" text-anchor="end" font-family="'SF Mono','Cascadia Code',Consolas,'Courier New',monospace" font-size="12" fill="#484f58">skills loaded @ runtime</text>

    <!-- ══ cores ══ -->
    <g font-family="'SF Mono','Cascadia Code',Consolas,'Courier New',monospace">
      <!-- core 1 -->
      <text x="28" y="74" font-size="13" fill="#c9d1d9">TypeScript / JavaScript</text>
      <text x="470" y="74" text-anchor="end" font-size="12" fill="#7d8590">92%</text>
      <rect x="28" y="80" width="442" height="8" rx="4" fill="#21262d"/>
      <rect x="28" y="80" width="407" height="8" rx="4" fill="url(#barGrad)">
        <animate attributeName="width" values="0;407" begin="0.3s" dur="0.9s" calcMode="spline" keySplines="0.2 0.8 0.2 1" fill="freeze"/>
      </rect>
      <g clip-path="url(#c1)">
        <rect x="-32" y="80" width="60" height="8" fill="url(#shine)">
          <animateTransform attributeName="transform" type="translate" values="0 0; 500 0" dur="3s" begin="1.6s" repeatCount="indefinite"/>
        </rect>
      </g>

      <!-- core 2 -->
      <text x="28" y="110" font-size="13" fill="#c9d1d9">React / Next.js</text>
      <text x="470" y="110" text-anchor="end" font-size="12" fill="#7d8590">90%</text>
      <rect x="28" y="116" width="442" height="8" rx="4" fill="#21262d"/>
      <rect x="28" y="116" width="398" height="8" rx="4" fill="url(#barGrad)">
        <animate attributeName="width" values="0;398" begin="0.45s" dur="0.9s" calcMode="spline" keySplines="0.2 0.8 0.2 1" fill="freeze"/>
      </rect>
      <g clip-path="url(#c2)">
        <rect x="-32" y="116" width="60" height="8" fill="url(#shine)">
          <animateTransform attributeName="transform" type="translate" values="0 0; 500 0" dur="3s" begin="1.9s" repeatCount="indefinite"/>
        </rect>
      </g>

      <!-- core 3 -->
      <text x="28" y="146" font-size="13" fill="#c9d1d9">Node / NestJS</text>
      <text x="470" y="146" text-anchor="end" font-size="12" fill="#7d8590">88%</text>
      <rect x="28" y="152" width="442" height="8" rx="4" fill="#21262d"/>
      <rect x="28" y="152" width="389" height="8" rx="4" fill="url(#barGrad)">
        <animate attributeName="width" values="0;389" begin="0.6s" dur="0.9s" calcMode="spline" keySplines="0.2 0.8 0.2 1" fill="freeze"/>
      </rect>
      <g clip-path="url(#c3)">
        <rect x="-32" y="152" width="60" height="8" fill="url(#shine)">
          <animateTransform attributeName="transform" type="translate" values="0 0; 500 0" dur="3s" begin="2.2s" repeatCount="indefinite"/>
        </rect>
      </g>

      <!-- core 4 -->
      <text x="28" y="182" font-size="13" fill="#c9d1d9">Ruby on Rails</text>
      <text x="470" y="182" text-anchor="end" font-size="12" fill="#7d8590">78%</text>
      <rect x="28" y="188" width="442" height="8" rx="4" fill="#21262d"/>
      <rect x="28" y="188" width="345" height="8" rx="4" fill="url(#barGrad)">
        <animate attributeName="width" values="0;345" begin="0.75s" dur="0.9s" calcMode="spline" keySplines="0.2 0.8 0.2 1" fill="freeze"/>
      </rect>
      <g clip-path="url(#c4)">
        <rect x="-32" y="188" width="60" height="8" fill="url(#shine)">
          <animateTransform attributeName="transform" type="translate" values="0 0; 500 0" dur="3s" begin="2.5s" repeatCount="indefinite"/>
        </rect>
      </g>

      <!-- core 5 -->
      <text x="28" y="218" font-size="13" fill="#c9d1d9">Solidity / Hardhat</text>
      <text x="470" y="218" text-anchor="end" font-size="12" fill="#7d8590">74%</text>
      <rect x="28" y="224" width="442" height="8" rx="4" fill="#21262d"/>
      <rect x="28" y="224" width="327" height="8" rx="4" fill="url(#barGrad)">
        <animate attributeName="width" values="0;327" begin="0.9s" dur="0.9s" calcMode="spline" keySplines="0.2 0.8 0.2 1" fill="freeze"/>
      </rect>
      <g clip-path="url(#c5)">
        <rect x="-32" y="224" width="60" height="8" fill="url(#shine)">
          <animateTransform attributeName="transform" type="translate" values="0 0; 500 0" dur="3s" begin="2.8s" repeatCount="indefinite"/>
        </rect>
      </g>

      <!-- core 6 -->
      <text x="28" y="254" font-size="13" fill="#c9d1d9">Docker / AWS</text>
      <text x="470" y="254" text-anchor="end" font-size="12" fill="#7d8590">80%</text>
      <rect x="28" y="260" width="442" height="8" rx="4" fill="#21262d"/>
      <rect x="28" y="260" width="354" height="8" rx="4" fill="url(#barGrad)">
        <animate attributeName="width" values="0;354" begin="1.05s" dur="0.9s" calcMode="spline" keySplines="0.2 0.8 0.2 1" fill="freeze"/>
      </rect>
      <g clip-path="url(#c6)">
        <rect x="-32" y="260" width="60" height="8" fill="url(#shine)">
          <animateTransform attributeName="transform" type="translate" values="0 0; 500 0" dur="3s" begin="3.1s" repeatCount="indefinite"/>
        </rect>
      </g>
    </g>

    <!-- ══ activity graph ══ -->
    <rect x="520" y="58" width="452" height="140" rx="8" fill="#161b22" stroke="#21262d"/>
    <text x="536" y="78" font-family="'SF Mono','Cascadia Code',Consolas,'Courier New',monospace" font-size="11" fill="#484f58">commit_activity — always compiling</text>

    <path d="M540 178 C558 172 572 154 592 156 C612 158 622 174 642 170 C662 166 672 142 692 144 C712 146 722 164 742 160 C762 156 772 130 792 134 C812 138 822 158 842 152 C862 146 872 120 892 124 C912 128 928 148 952 140 L952 190 L540 190 Z" fill="#1f6feb" opacity="0">
      <animate attributeName="opacity" values="0;0.12" begin="2.6s" dur="0.6s" fill="freeze"/>
    </path>
    <path d="M540 178 C558 172 572 154 592 156 C612 158 622 174 642 170 C662 166 672 142 692 144 C712 146 722 164 742 160 C762 156 772 130 792 134 C812 138 822 158 842 152 C862 146 872 120 892 124 C912 128 928 148 952 140" stroke="#58a6ff" stroke-width="2" stroke-linecap="round" fill="none" stroke-dasharray="1200" stroke-dashoffset="1200">
      <animate attributeName="stroke-dashoffset" values="1200;0" begin="0.8s" dur="2s" fill="freeze"/>
    </path>
    <circle r="3.5" fill="#2dd4bf" filter="url(#dotGlow)" opacity="0">
      <animateMotion path="M540 178 C558 172 572 154 592 156 C612 158 622 174 642 170 C662 166 672 142 692 144 C712 146 722 164 742 160 C762 156 772 130 792 134 C812 138 822 158 842 152 C862 146 872 120 892 124 C912 128 928 148 952 140" dur="6s" begin="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.06;0.94;1" dur="6s" begin="3.2s" repeatCount="indefinite"/>
    </circle>

    <!-- ══ status chips ══ -->
    <g font-family="'SF Mono','Cascadia Code',Consolas,'Courier New',monospace" font-size="12">
      <rect x="520" y="224" width="132" height="30" rx="15" fill="#161b22" stroke="#30363d"/>
      <text x="586" y="243" text-anchor="middle" fill="#3fb950">uptime: 5+ yrs</text>

      <rect x="666" y="224" width="152" height="30" rx="15" fill="#161b22" stroke="#30363d"/>
      <text x="742" y="243" text-anchor="middle" fill="#c9d1d9">side_projects: <tspan fill="#a371f7">∞</tspan></text>

      <rect x="832" y="224" width="140" height="30" rx="15" fill="#161b22" stroke="#30363d"/>
      <text x="902" y="243" text-anchor="middle" fill="#c9d1d9">coffee: <tspan fill="#f85149">LOW<animate attributeName="opacity" values="1;0.3;1" dur="1.6s" repeatCount="indefinite"/></tspan></text>
    </g>
  </g>

  <rect x="1" y="1" width="998" height="288" rx="18" stroke="#30363d" stroke-width="1" fill="none"/>
</svg>
