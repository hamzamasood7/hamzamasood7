<svg width="1000" height="44" viewBox="0 0 1000 44" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <clipPath id="strip">
      <rect x="1" y="1" width="998" height="42" rx="10"/>
    </clipPath>
    <linearGradient id="fadeL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0d1117" stop-opacity="1"/>
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="fadeR" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0%" stop-color="#0d1117" stop-opacity="1"/>
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect x="1" y="1" width="998" height="42" rx="10" fill="#0d1117"/>

  <g clip-path="url(#strip)" font-family="'SF Mono','Cascadia Code',Consolas,'Courier New',monospace" font-size="13">
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0; -1700 0" dur="32s" repeatCount="indefinite"/>

      <!-- copy 1 -->
      <g>
        <text x="110" y="27" fill="#a371f7">⬢ 0x7f3a…9c21 <tspan fill="#3fb950">✓ SETTLED</tspan> <tspan fill="#e6edf3">$12,400.50</tspan></text>
        <text x="390" y="27" fill="#7d8590">POS TXN #48211 <tspan fill="#3fb950">✓ APPROVED</tspan> · 142ms</text>
        <text x="690" y="27" fill="#a371f7">⛓ block #19442138 <tspan fill="#3fb950">✓ mined</tspan></text>
        <text x="930" y="27" fill="#58a6ff">deploy payments-api v2.4.1 <tspan fill="#3fb950">→ live ✓</tspan></text>
        <text x="1240" y="27" fill="#7d8590">stripe.charge <tspan fill="#3fb950">✓</tspan> <tspan fill="#e6edf3">$890.00</tspan> · card_visa</text>
        <text x="1550" y="27" fill="#f778ba">☕ coffee.refill() <tspan fill="#3fb950">→ 200 OK</tspan></text>
      </g>
      <!-- copy 2, shifted one full loop -->
      <g transform="translate(1700 0)">
        <text x="110" y="27" fill="#a371f7">⬢ 0x7f3a…9c21 <tspan fill="#3fb950">✓ SETTLED</tspan> <tspan fill="#e6edf3">$12,400.50</tspan></text>
        <text x="390" y="27" fill="#7d8590">POS TXN #48211 <tspan fill="#3fb950">✓ APPROVED</tspan> · 142ms</text>
        <text x="690" y="27" fill="#a371f7">⛓ block #19442138 <tspan fill="#3fb950">✓ mined</tspan></text>
        <text x="930" y="27" fill="#58a6ff">deploy payments-api v2.4.1 <tspan fill="#3fb950">→ live ✓</tspan></text>
        <text x="1240" y="27" fill="#7d8590">stripe.charge <tspan fill="#3fb950">✓</tspan> <tspan fill="#e6edf3">$890.00</tspan> · card_visa</text>
        <text x="1550" y="27" fill="#f778ba">☕ coffee.refill() <tspan fill="#3fb950">→ 200 OK</tspan></text>
      </g>
    </g>

    <!-- edge fades -->
    <rect x="1" y="1" width="110" height="42" fill="url(#fadeL)"/>
    <rect x="889" y="1" width="110" height="42" fill="url(#fadeR)"/>
  </g>

  <!-- LIVE indicator -->
  <circle cx="26" cy="22" r="4" fill="#3fb950">
    <animate attributeName="r" values="3.4;4.6;3.4" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="26" cy="22" r="4" fill="none" stroke="#3fb950" stroke-width="1.5">
    <animate attributeName="r" values="4;11" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.7;0" dur="2s" repeatCount="indefinite"/>
  </circle>
  <text x="40" y="26.5" font-family="'SF Mono','Cascadia Code',Consolas,'Courier New',monospace" font-size="11" font-weight="bold" letter-spacing="1.5" fill="#3fb950">LIVE</text>

  <rect x="1" y="1" width="998" height="42" rx="10" stroke="#30363d" stroke-width="1" fill="none"/>
</svg>
